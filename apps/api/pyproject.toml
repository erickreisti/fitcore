[project]
name = "api"
version = "0.1.0"
description = "API do FitCore — sistema de gestão para redes de academias"
readme = "README.md"
authors = [
    { name = "Erick", email = "erickreisti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# Sem build-system: este projeto não é um pacote publicável.
# O uv gerencia o ambiente virtual e as dependências diretamente.
