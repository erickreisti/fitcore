# .github/workflows/ci.yml
#
# Pipeline de CI (Integração Contínua)
#
# O que faz:
#   - Roda a cada push em qualquer branch
#   - Executa lint e testes do back-end (FastAPI)
#   - Executa lint e testes do front-end (Next.js)
#
# Depois de validar o código, um pipeline de CD (deploy) será adicionado
# para fazer o deploy automático quando o código for mergeado na main.

name: CI

on:
  push:
    branches: ["**"] # Trabalha em todo "push" (envio) para QUALQUER branch
  pull_request:
    branches: [main] # Também trabalha quando criamos um Pedido de Fusão (PR) para a branch "main"

# "jobs" (tarefas) - Aqui listamos o que o robô tem que fazer
jobs:
  # ──────────────────────────────────────────────
  # TAREFA 1: Back-end (API em Python/FastAPI)
  # ──────────────────────────────────────────────
  api:
    name: API (FastAPI) # Nome descritivo da tarefa
    runs-on: ubuntu-latest # O sistema operacional que o GitHub vai emprestar pra gente (Linux Ubuntu)

    # "services" - Ferramentas de apoio que a nossa API precisa para ser testada
    services:
      # Aqui dizemos pro GitHub: "Por favor, suba um banco PostgreSQL rápido só para meus testes"
      postgres:
        image: postgres:16-alpine # Versão do banco (mesma do nosso docker-compose local)
        env:
          POSTGRES_USER: fitcore
          POSTGRES_PASSWORD: fitcore_test
          POSTGRES_DB: fitcore_test
        ports:
          - 5432:5432 # Abre a porta para a nossa API se conectar
        options: >- # Verifica se o banco já ligou antes de começar os testes
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # "steps" (passos) - A receita de bolo, linha por linha, do que o servidor vai executar
    steps:
      - uses: actions/checkout@v4
        # "checkout" é a ação de baixar o nosso código lá do repositório para o servidor do GitHub

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # O "uv" é a ferramenta ultra-rápida de instalar pacotes Python que estamos usando

      - name: Set up Python
        run: uv python install 3.12
        # Pede pro "uv" instalar a versão 3.12 do Python na máquina do GitHub

      - name: Install dependencies
        working-directory: apps/api # Entra na pasta da nossa API
        run: uv sync --all-extras
        # Baixa todas as bibliotecas que nosso código Python precisa pra rodar (ex: FastAPI)

      # TODO: Descomentar essas etapas quando instalarmos as ferramentas de teste
