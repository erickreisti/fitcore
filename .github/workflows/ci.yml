      #     DATABASE_URL: postgresql+asyncpg://fitcore:fitcore_test@localhost:5432/fitcore_test
      #     SECRET_KEY: test-secret-key
      #     ENVIRONMENT: test
      #   run: uv run pytest tests/ -v
      #   # Finalmente, roda o comando de testes (Pytest) para executar os testes que escrevermos

  # ──────────────────────────────────────────────
